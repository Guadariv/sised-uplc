    <!-- Alpine.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF & html2canvas for Robust Multi-page PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        uplc: {
                            blue: '#1e3a8a',
                            teal: '#0d9488',
                            red: '#dc2626',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0f172a;
            --accent-color: #0d9488;
            --accent-red: #dc2626;
            --bg-color: #f8fafc;
            --text-color: #0f172a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .likert-btn { transition: all 0.2s ease; }
        .likert-btn.selected {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.3);
        }

        @media print {
            body * { visibility: hidden !important; }
            #printable-report, #printable-report * { visibility: visible !important; }
            #printable-report { 
                position: absolute !important; 
                left: 0 !important; 
                top: 0 !important; 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 15mm !important; 
                box-shadow: none !important; 
                background: white !important; 
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            .print-break-before { page-break-before: always; break-before: page; }
            .print-break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="h-full antialiased flex flex-col" x-data="sisedUplcApp()" x-init="initApp()">

    <div class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="pointer-events-auto flex items-center p-4 mb-3 rounded-xl shadow-xl text-white transition-all transform translate-y-0"
                 :class="{
                    'bg-emerald-600': toast.type === 'success',
                    'bg-red-600': toast.type === 'error',
                    'bg-amber-600': toast.type === 'warning',
                    'bg-blue-600': toast.type === 'info'
                 }">
                <i class="mr-3 text-lg" :class="{
                    'fas fa-check-circle': toast.type === 'success',
                    'fas fa-exclamation-circle': toast.type === 'error',
                    'fas fa-triangle-exclamation': toast.type === 'warning',
                    'fas fa-info-circle': toast.type === 'info'
                }"></i>
                <span class="text-sm font-medium" x-text="toast.message"></span>
                <button @click="removeToast(toast.id)" class="ml-4 text-white hover:text-gray-200 cursor-pointer">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </template>
    </div>

    <div class="flex-1 flex flex-col h-full overflow-hidden w-full">

        <template x-if="currentView === 'landing'">
            <div class="flex-1 flex flex-col justify-between bg-gradient-to-br from-[#1e3a8a] via-[#0f172a] to-[#042f2e] p-6 overflow-y-auto w-full h-full">
                <div class="max-w-xl w-full mx-auto my-auto bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8 md:p-10 text-white text-center">
                    
                    <div class="inline-block px-6 py-2 bg-teal-500/20 border border-teal-400/40 rounded-2xl mb-4 shadow-inner">
                        <span class="text-3xl font-extrabold tracking-widest text-teal-300 font-sans">UPLC</span>
                        <span class="block text-[11px] uppercase text-slate-300 tracking-wider">Universidad Politécnica de Lázaro Cárdenas, Michoacán</span>
                    </div>

                    <h1 class="text-xl md:text-2xl font-extrabold tracking-tight mb-2">Evaluación y Seguimiento Docente</h1>
                    
                    <div class="inline-block px-4 py-1.5 bg-teal-600/30 border border-teal-400/30 rounded-full text-xs font-semibold text-teal-200 mb-4">
                        <i class="fas fa-circle text-[8px] text-emerald-400 mr-1.5 animate-pulse"></i>
                        Jornada Activa: <span x-text="getActiveJornada() ? getActiveJornada().nombre : 'Sin jornada activa'"></span>
                    </div>

                    <p class="text-slate-300 text-sm max-w-md mx-auto mb-6">
                        "Tu opinión es importante para fortalecer la calidad académica de nuestra institución."
                    </p>

                    <!-- Student Identification Form (Matrícula O Correo - Al menos uno) -->
                    <form @submit.prevent="startStudentEvaluation()" class="space-y-4 text-left bg-white/5 p-6 rounded-2xl border border-white/10">


                        <div>
                            <label class="block text-xs font-semibold text-teal-300 uppercase tracking-wider mb-1.5">Carrera *</label>
                            <select x-model="studentForm.carrera" @change="updateGruposForCarrera()" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500 text-sm">
                                <option value="">Seleccione carrera...</option>
                                <template x-for="c in carreras" :key="c.id">
                                    <option :value="c.nombre" x-text="c.nombre"></option>
                                </template>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-teal-300 uppercase tracking-wider mb-1.5">Grupo *</label>
                            <select x-model="studentForm.grupo" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500 text-sm">
                                <option value="">Seleccione grupo...</option>
                                <template x-for="g in getAvailableGruposForSelection()" :key="g.id">
                                    <option :value="g.nombre" x-text="'Grupo ' + g.nombre + (g.cuatrimestre ? ' (' + g.cuatrimestre + '° Cuatrimestre)' : '')"></option>
                                </template>
                            </select>
                        </div>

                        <button type="submit" class="w-full py-4 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-base mt-2 cursor-pointer">
                            <span>INICIAR EVALUACIÓN</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>
<div class="mt-5">
    <button
        type="button"
        @click="loginStudentWithGoogle()"
        class="w-full bg-white text-slate-800 font-bold
               py-4 px-6 rounded-xl shadow-lg
               hover:bg-slate-100 transition
               flex items-center justify-center gap-3">

        <i class="fab fa-google text-lg"></i>

        <span>Continuar con Google</span>
    </button>

    <p class="text-center text-slate-400 text-xs mt-3">
        Inicia sesión con tu cuenta de Google
        para verificar tu identidad.
    </p>
</div>
                   
                </div>

                <footer class="text-center py-4 no-print">
                    <button @click="currentView = 'admin_login'; adminUser = ''; adminPass = ''" class="text-slate-400 hover:text-teal-300 text-xs font-medium transition inline-flex items-center space-x-1.5 bg-black/30 px-4 py-2 rounded-xl border border-white/10 cursor-pointer">
                        <i class="fas fa-lock text-[10px]"></i>
                        <span>Acceso administrativo</span>
                    </button>
                </footer>
            </div>
        </template>

        <template x-if="currentView === 'admin_login'">
            <div class="flex-1 flex items-center justify-center bg-slate-900 p-6 w-full h-full">
                <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 text-white">
                    <div class="text-center mb-8">
                        <button @click="currentView = 'landing'" class="text-slate-400 hover:text-white mb-4 inline-flex items-center text-sm cursor-pointer">
                            <i class="fas fa-arrow-left mr-2"></i> Volver a evaluación estudiantil
                        </button>
                        <div class="inline-block px-4 py-1.5 bg-teal-500/20 text-teal-400 rounded-xl font-bold text-xl mb-3 border border-teal-500/30 font-sans">
                            UPLC
                        </div>
                        <h2 class="text-2xl font-bold">Acceso Administrativo</h2>
                        <p class="text-slate-400 text-sm">Dirección de Programas Académicos</p>
                    </div>

                    <form @submit.prevent="loginAdmin" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuario Administrador</label>
                            <input type="text" x-model="adminUser" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500" placeholder="admin@uplc.edu.mx">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                            <input type="password" x-model="adminPass" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 font-semibold rounded-xl shadow-lg transition text-white cursor-pointer">
                            Iniciar Sesión
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <template x-if="currentView === 'student_evaluation_flow'">
            <div class="flex-1 flex flex-col bg-slate-50 overflow-y-auto w-full h-full">
                <header class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-20 flex justify-between items-center shadow-sm no-print">
                    <div class="flex items-center space-x-3">
                        <div class="px-3 py-1 bg-[#1e3a8a] text-white font-extrabold rounded-lg text-sm font-sans">
                            UPLC
                        </div>
                        <div>
                            <h1 class="text-sm md:text-base font-bold text-slate-800">Evaluación Docente UPLC</h1>
                            <p class="text-xs text-slate-500">Jornada Activa: <span class="font-semibold text-teal-700" x-text="getActiveJornada() ? getActiveJornada().nombre : ''"></span></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="text-right hidden sm:block">
                            <span class="text-xs font-bold text-slate-700 block" x-text="'Grupo: ' + studentForm.grupo"></span>
                            <span class="text-[10px] text-slate-400" x-text="studentForm.carrera"></span>
                        </div>
                        <button @click="tryExitEvaluation()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition cursor-pointer">
                            Salir
                        </button>
                    </div>
                </header>

                <main class="flex-1 max-w-3xl w-full mx-auto p-4 md:p-8">
                    <template x-if="studentState === 'evaluating' || studentState === 'questionnaire'">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-teal-700 uppercase tracking-wider" x-text="'Docente ' + (currentTeacherIndex + 1) + ' de ' + getGroupAssignments().length"></span>
                                <span class="text-sm font-extrabold text-[#1e3a8a]" x-text="getStudentProgressPercentage() + '%' "></span>
                            </div>
                            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                <div class="bg-teal-600 h-full transition-all duration-300" :style="'width: ' + getStudentProgressPercentage() + '%'"></div>
                            </div>
                        </div>
                    </template>

                    <template x-if="studentState === 'evaluating' && getCurrentAssignment()">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm space-y-6">
                            <div class="border-b border-slate-100 pb-4">
                                <span class="px-3 py-1 bg-teal-50 text-teal-800 text-xs font-semibold rounded-full mb-2 inline-block" x-text="getCurrentAssignment().carrera"></span>
                                <h2 class="text-2xl font-bold text-slate-800" x-text="getCurrentAssignment().docente"></h2>
                                <p class="text-sm text-slate-600 font-medium mt-1"><span class="text-slate-400">Asignatura:</span> <span x-text="getCurrentAssignment().materia"></span></p>
                            </div>

                            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center space-y-4">
                                <div class="w-12 h-12 bg-blue-100 text-[#1e3a8a] rounded-xl mx-auto flex items-center justify-center text-xl">
                                    <i class="fas fa-question"></i>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800">¿Cursas actualmente esta asignatura?</h3>
                                
                                <div class="flex justify-center space-x-4 pt-2">
                                    <button @click="answerBranching(true)" class="px-8 py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow transition w-32 cursor-pointer">
                                        SÍ
                                    </button>
                                    <button @click="answerBranching(false)" class="px-8 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl shadow transition w-32 cursor-pointer">
                                        NO
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="studentState === 'questionnaire' && getCurrentAssignment()">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm space-y-6">
                            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                                <div>
                                    <span class="text-xs font-semibold text-teal-700 uppercase tracking-wider" x-text="getCurrentAssignment().materia"></span>
                                    <h3 class="text-xl font-bold text-slate-800" x-text="getCurrentAssignment().docente"></h3>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 block">Pregunta</span>
                                    <span class="text-lg font-bold text-[#1e3a8a]" x-text="(currentQuestionIndex + 1) + ' / ' + activeQuestions.length"></span>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <span class="inline-block px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-semibold rounded-md" x-text="activeQuestions[currentQuestionIndex].categoria"></span>
                                <h4 class="text-lg font-semibold text-slate-800" x-text="(currentQuestionIndex + 1) + '. ' + activeQuestions[currentQuestionIndex].texto"></h4>

                                <template x-if="activeQuestions[currentQuestionIndex].tipo === 'Likert 1-10'">
                                    <div class="pt-4">
                                        <div class="flex justify-between text-xs font-semibold text-slate-400 mb-2">
                                            <span>1 (Totalmente en desacuerdo)</span>
                                            <span>10 (Totalmente de acuerdo)</span>
                                        </div>
                                        <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                                            <template x-for="n in 10">
                                                <button type="button" 
                                                        @click="studentAnswers[activeQuestions[currentQuestionIndex].id] = n"
                                                        class="py-3.5 border-2 rounded-xl font-bold text-sm likert-btn cursor-pointer"
                                                        :class="studentAnswers[activeQuestions[currentQuestionIndex].id] === n ? 'bg-[#1e3a8a] text-white border-[#1e3a8a] shadow-md scale-105' : 'bg-white text-slate-700 border-slate-200 hover:border-teal-400'"
                                                        x-text="n">
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="activeQuestions[currentQuestionIndex].tipo === 'Texto largo' || activeQuestions[currentQuestionIndex].tipo === 'Texto corto'">
                                    <div class="pt-2">
                                        <textarea x-model="studentAnswers[activeQuestions[currentQuestionIndex].id]" rows="4" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-4 text-slate-800 focus:outline-none focus:border-teal-600 text-sm" placeholder="Escribe tus comentarios u observaciones aquí..."></textarea>
                                    </div>
                                </template>
                            </div>

                            <div class="flex justify-between pt-6 border-t border-slate-200">
                                <button @click="prevQuestion()" :disabled="currentQuestionIndex === 0" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm disabled:opacity-50 transition cursor-pointer">
                                    <i class="fas fa-arrow-left mr-2"></i> Anterior
                                </button>
                                <button @click="nextQuestion()" class="px-6 py-2.5 bg-[#1e3a8a] hover:bg-blue-900 text-white font-semibold rounded-xl text-sm shadow transition flex items-center space-x-2 cursor-pointer">
                                    <span x-text="currentQuestionIndex === activeQuestions.length - 1 ? 'Guardar y Siguiente Docente' : 'Siguiente'"></span>
                                    <i class="fas fa-arrow-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </template>

                    <template x-if="studentState === 'completed'">
                        <div class="bg-white border border-slate-200 rounded-2xl p-10 shadow-sm text-center max-w-lg mx-auto my-12 space-y-6">
                            <div class="w-20 h-20 bg-teal-100 text-teal-700 rounded-3xl mx-auto flex items-center justify-center text-3xl">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800">¡Evaluación completada!</h3>
                            <p class="text-slate-600 text-sm">
                                "Gracias por participar en el proceso de seguimiento y evaluación docente. Tus respuestas fortalecen la calidad académica de nuestro grupo."
                            </p>
                            <button @click="currentView = 'landing'" class="w-full py-3.5 bg-[#1e3a8a] hover:bg-blue-900 text-white font-semibold rounded-xl shadow transition cursor-pointer">
                                Finalizar y Salir
                            </button>
                        </div>
                    </template>
                </main>
            </div>
        </template>

        <template x-if="currentView.startsWith('admin_') && currentView !== 'admin_login'">
            <div class="flex-1 flex h-full overflow-hidden bg-slate-100 w-full">

                <!-- Admin Sidebar -->
                <aside class="w-64 bg-[#0f172a] border-r border-slate-800 text-slate-300 flex flex-col hidden lg:flex no-print">
                    <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                        <div class="px-3 py-1 bg-teal-600 text-white font-extrabold rounded-lg text-sm font-sans">
                            UPLC
                        </div>
                        <div>
                            <span class="font-extrabold text-white text-base tracking-wide">SISED</span>
                            <span class="block text-[10px] text-teal-400 font-medium">Seguimiento Docente Continuo</span>
                        </div>
                    </div>

                    <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-1 text-sm">
                        <a @click="currentView = 'admin_dashboard'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_dashboard' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-chart-pie w-5 text-teal-400"></i><span>Dashboard</span>
                        </a>
                        <a @click="currentView = 'admin_jornadas'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_jornadas' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-calendar-alt w-5 text-teal-400"></i><span>Periodos y Jornadas</span>
                        </a>
                        <a @click="currentView = 'admin_carreras'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_carreras' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-university w-5 text-teal-400"></i><span>Carreras</span>
                        </a>
                        <a @click="currentView = 'admin_grupos'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_grupos' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-users-rectangle w-5 text-teal-400"></i><span>Grupos</span>
                        </a>
                        <a @click="currentView = 'admin_docentes'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_docentes' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-chalkboard-user w-5 text-teal-400"></i><span>Docentes</span>
                        </a>
                        <a @click="currentView = 'admin_materias'" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition cursor-pointer" :class="currentView === 'admin_materias' ? 'bg-[#1e3a8a] text-white shadow' : 'hover:bg-slate-800 text-slate-400 hover:text-white'">
                            <i class="fas fa-book w-5 text-teal-400"></i><span>Materias</span>
                        </a>

getTeacherQuestionResults(asig = null) {
    const asignacion = asig || this.selectedSpecificAssignment;

    if (!asignacion) return [];

    const jornada = this.getActiveJornada();
    if (!jornada) return [];

    // Obtener la encuesta correspondiente a la jornada
    const encuesta = this.encuestasList.find(
        e => e.id === jornada.encuestaId
    );

    if (!encuesta || !Array.isArray(encuesta.preguntas)) {
        return [];
    }

    // Utilizar exclusivamente preguntas de escala 1-10
   const preguntas = encuesta.preguntas.filter(
    p => ['Likert 1-10', 'Escala 1-10', 'Escala Likert 1-10']
        .includes(p.tipo)
);

    if (preguntas.length === 0) return [];

    // Obtener únicamente evaluaciones de la asignación seleccionada
    const evaluacionesDocente = this.evaluaciones.filter(e => {
        const participacion = this.participaciones.find(
            p => p.id === e.participationId
        );

        if (!participacion) return false;

        return (
            e.docenteId === asignacion.docenteId &&
            e.materiaId === asignacion.materiaId &&
            e.cursaMateria === true &&
            participacion.sessionId === jornada.id &&
            participacion.grupo === asignacion.grupo &&
            participacion.carrera === asignacion.carrera
        );
    });

    if (evaluacionesDocente.length === 0) return [];

    const resultados = [];

    preguntas.forEach(pregunta => {
        let suma = 0;
        let cantidad = 0;

        evaluacionesDocente.forEach(evaluacion => {
            const respuestas = evaluacion.respuestas || {};
            const valor = respuestas[String(pregunta.id)];

            if (
                valor === undefined ||
                valor === null ||
                valor === ''
            ) {
                return;
            }

            const numero = Number(valor);

            if (
                Number.isFinite(numero) &&
                numero >= 1 &&
                numero <= 10
            ) {
                suma += numero;
                cantidad++;
            }
        });

        if (cantidad > 0) {
            const promedio = suma / cantidad;

            resultados.push({
                id: pregunta.id,
                texto: pregunta.texto,
                promedio: promedio.toFixed(1),
                porcentaje: Math.min(100, Math.max(0, promedio * 10)),
                respuestas: cantidad,
                orden: pregunta.orden || 0
            });
        }
    });

    return resultados.sort((a, b) => a.orden - b.orden);
},

    const asignaciones = this.getGeneralTeacherAssignments();
    const jornada = this.getActiveJornada();

    if (!jornada || asignaciones.length === 0) return [];

    const encuesta = this.encuestasList.find(
        e => e.id === jornada.encuestaId
    );

    if (!encuesta || !Array.isArray(encuesta.preguntas)) {
        return [];
    }

    const preguntas = encuesta.preguntas.filter(
        p => ['Likert 1-10', 'Escala 1-10', 'Escala Likert 1-10']
            .includes(p.tipo)
    );

    const evaluaciones = this.evaluaciones.filter(e => {
        const participacion = this.participaciones.find(
            p => p.id === e.participationId
        );

        if (!participacion || e.cursaMateria !== true) {
            return false;
        }

        return asignaciones.some(a =>
            e.docenteId === a.docenteId &&
            e.materiaId === a.materiaId &&
            participacion.sessionId === jornada.id &&
            participacion.grupo === a.grupo &&
            participacion.carrera === a.carrera
        );
    });

    return preguntas.map(pregunta => {
        let suma = 0;
        let cantidad = 0;

        evaluaciones.forEach(e => {
            const valor = (e.respuestas || {})[String(pregunta.id)];
            if (valor === null || valor === undefined || valor === '') {
                return;
            }

            const numero = Number(valor);

            if (Number.isFinite(numero) && numero >= 1 && numero <= 10) {
                suma += numero;
                cantidad++;
            }
        });

        if (cantidad === 0) return null;

        const promedio = suma / cantidad;

        return {
            id: pregunta.id,
            texto: pregunta.texto,
            promedio: promedio.toFixed(1),
            porcentaje: Math.min(100, Math.max(0, promedio * 10)),
            respuestas: cantidad,
            orden: pregunta.orden || 0
        };
    })
    .filter(r => r !== null)
    .sort((a, b) => a.orden - b.orden);
},

             async duplicateSurvey(enc) {

    try {

        const confirmar = confirm(
            `¿Desea crear una copia de "${enc.nombre}"?`
        );

        if (!confirmar) return;


        // CREAR COPIA DE LA ENCUESTA
        const { data: nuevaEncuesta, error } = await db
            .from('surveys')
            .insert({
                name: enc.nombre + ' (Copia)',
                description: enc.descripcion || '',
                status: 'Borrador'
            })
            .select()
            .single();

        if (error) throw error;


        // COPIAR SUS PREGUNTAS
        if (Array.isArray(enc.preguntas) && enc.preguntas.length > 0) {

            const nuevasPreguntas = enc.preguntas.map(
                (pregunta, index) => ({
                    survey_id: nuevaEncuesta.id,
                    question_text: pregunta.texto,
                    question_type: pregunta.tipo || 'Likert 1-10',
                    question_order: index + 1,
                    required: pregunta.requerida ?? true,
                    category: pregunta.categoria || null
                })
            );

            const { error: preguntasError } = await db
                .from('survey_questions')
                .insert(nuevasPreguntas);

            if (preguntasError) throw preguntasError;
        }


        // AGREGAR A LA PANTALLA
        const copiaUI = {
            id: nuevaEncuesta.id,
            nombre: nuevaEncuesta.name,
            descripcion: nuevaEncuesta.description || '',
            estado: nuevaEncuesta.status,

            preguntas: enc.preguntas.map(p => ({
                ...p
            }))
        };

        this.encuestasList.push(copiaUI);
        this.showToast(
            'Encuesta duplicada correctamente.',
            'success'
        );

    } catch (error) {

        console.error(
            'Error duplicando encuesta:',
            error
        );

        this.showToast(
            'No se pudo duplicar la encuesta.',
            'error'
        );
    }
},
async deleteSurvey(enc) {

    try {

        // Verificar si la encuesta está vinculada a una jornada
        const { count, error: countError } = await db
            .from('monitoring_sessions')
            .select('*', { count: 'exact', head: true })
            .eq('survey_id', enc.id);

        if (countError) throw countError;


        // Si está en uso, no permitir eliminar
        if (count > 0) {

            alert(
                `La encuesta "${enc.nombre}" está asignada a ${count} jornada(s).\n\n` +
                `No puede eliminarse mientras esté siendo utilizada.`
            );

            return;
        }


        const confirmar = confirm(
            `¿Está seguro de eliminar la encuesta "${enc.nombre}"?\n\n` +
            `También se eliminarán todas sus preguntas.`
        );

        if (!confirmar) return;


        // Eliminar encuesta de Supabase
        // Las preguntas se eliminan automáticamente por ON DELETE CASCADE
        const { error } = await db
            .from('surveys')
            .delete()
            .eq('id', enc.id);

        if (error) throw error;


        // Eliminar de la pantalla
        this.encuestasList = this.encuestasList.filter(
            e => e.id !== enc.id
        );


        this.showToast(
            'Encuesta eliminada correctamente.',
            'success'
        );

        console.log(
            'Encuesta eliminada de Supabase:',
            enc.id
        );

    } catch (error) {

        console.error(
            'Error eliminando encuesta:',
            error
        );

        this.showToast(
            'No se pudo eliminar la encuesta.',
            'error'
        );
    }

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const text = e.target.result;
                        const lines = text.split('\n');
                        const result = [];
                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            const cols = lines[i].split(',');
                            if (cols.length >= 8) {
                                result.push({
                                    Periodo: cols[0]?.trim(),
                                    Carrera: cols[1]?.trim(),
                                    Grupo: cols[2]?.trim(),
                                    Cuatrimestre: cols[3]?.trim(),
                                    ClaveMateria: cols[4]?.trim(),
                                    Materia: cols[5]?.trim(),
                                    ClaveDocente: cols[6]?.trim(),
                                    Docente: cols[7]?.trim()
                                });
                            }
                        }
                        if (result.length > 0) {
                            this.importPreviewData = result;
                            this.showToast('Archivo analizado con éxito. ' + result.length + ' registros detectados.', 'success');
                        } else {
                            this.showToast('El archivo no tiene el formato correcto.', 'error');
                        }
                    };
                    reader.readAsText(file);
                },

                    let added = 0;

                        }
                        if (!this.materias.some(m => m.nombre === row.Materia)) {

                        if (!this.grupos.some(g => g.nombre === row.Grupo && g.carrera === row.Carrera)) {
                            this.grupos.push({ id: Date.now() + Math.random(), nombre: row.Grupo, cuatrimestre: Number(row.Cuatrimestre) || 3, carrera: row.Carrera, periodo: row.Periodo });
                        }
                        if (!this.asignaciones.some(a => a.periodo === row.Periodo && a.grupo === row.Grupo && a.materia === row.Materia && a.docente === row.Docente)) {

        if (!carrera) {
            this.showToast('No se encontró la carrera.', 'error');
            return;
        }

        if (!grupo) {
            this.showToast('No se encontró el grupo.', 'error');
            return;
        }

        if (!materia) {
            this.showToast('No se encontró la materia.', 'error');
            return;
        }

        if (!docente) {
            this.showToast('No se encontró el docente.', 'error');
            return;
        }

        if (!jornada) {
            this.showToast('No se encontró la jornada.', 'error');
            return;
        }

        // Guardar relación real en Supabase
        const { data, error } = await db
            .from('assignments')
            .insert({
                session_id: jornada.id,
                group_id: grupo.id,
                subject_id: materia.id,
                teacher_id: docente.id
            })
            .select(`
                id,
                session_id,
                group_id,
                subject_id,
                teacher_id
            `)
            .single();

        if (error) throw error;

        // Agregar inmediatamente a la tabla de SISED
        this.asignaciones.push({
            id: data.id,

            jornadaId: data.session_id,
            grupoId: data.group_id,
            materiaId: data.subject_id,
            docenteId: data.teacher_id,

            periodo: periodo.nombre,
            carrera: carrera.nombre,
            grupo: grupo.nombre,
            materia: materia.nombre,
            docente: docente.nombre,
            jornada: jornada.nombre
        });

        this.modalActive = false;

        this.showToast(
            'Asignación guardada correctamente.',
            'success'
        );

        console.log(
            'Asignación guardada en Supabase:',
            data
        );

    } catch (error) {

        console.error(
            'Error guardando asignación:',
            error
        );

        this.showToast(
            'No se pudo guardar la asignación.',
            'error'
        );
    }
},

                async deleteJornada(id) {
    try {

        const jornada = this.jornadasList.find(j => j.id === id);

        if (!jornada) {
            this.showToast('No se encontró la jornada.', 'error');
            return;
        }

        const confirmar = confirm(
            `¿Está seguro de eliminar la jornada "${jornada.nombre}"?`
        );

        if (!confirmar) return;

        const { error } = await db
            .from('monitoring_sessions')
            .delete()
            .eq('id', id);

        if (error) throw error;

        this.jornadasList = this.jornadasList.filter(
            j => j.id !== id
        );

        this.showToast(
            'Jornada eliminada correctamente.',
            'success'
        );

        console.log('Jornada eliminada de Supabase:', id);

    } catch (error) {

        console.error(
            'Error eliminando jornada:',
            error
        );

        this.showToast(
            'No se pudo eliminar la jornada.',
            'error'
        );
    }
},

                async deleteDocente(id) {
    try {
        const docente = this.docentes.find(d => d.id === id);

        if (!docente) {
            this.showToast('No se encontró el docente.', 'error');
            return;
        }

        // Verificar si tiene asignaciones
        const { count, error: countError } = await db
            .from('assignments')
            .select('*', { count: 'exact', head: true })
            .eq('teacher_id', id);

        if (countError) throw countError;

        // No permitir eliminar si está siendo utilizado
        if (count > 0) {
            alert(
                `${docente.nombre} tiene ${count} asignación(es) registrada(s).\n\n` +
                `No se puede eliminar mientras tenga asignaciones.`
            );

            return;
        }

        const confirmar = confirm(
            `¿Está seguro de eliminar al docente "${docente.nombre}"?`
        );

        if (!confirmar) return;

        const { error } = await db
            .from('teachers')
            .delete()
            .eq('id', id);

        if (error) throw error;

        this.docentes = this.docentes.filter(
            d => d.id !== id
        );

        this.showToast(
            'Docente eliminado correctamente.',
            'success'
        );

        console.log(
            'Docente eliminado de Supabase:',
            id
        );

    } catch (error) {
        console.error(
            'Error eliminando docente:',
            error
        );

        this.showToast(
            'No se pudo eliminar el docente.',
            'error'
        );
    }
},

               async deleteAsignacion(id) {
